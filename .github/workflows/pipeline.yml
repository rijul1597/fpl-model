name: pipeline

on:
  schedule:
    - cron: "23 * * * *" # hourly, off the top of the hour when GitHub's scheduler is busiest
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "fplmodel/**"
      - "appmodel/**"
      - "config.json"
      - "requirements.txt"
      - ".github/workflows/pipeline.yml"

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      SOLVER_COMMIT: ec65f5e2b2be34441cb4b2a9efafea1ec0fe3b79 # keep in sync with fplmodel/solve.py
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Get the solver (pinned commit)
        run: |
          git clone --quiet https://github.com/sertalpbilal/FPL-Optimization-Tools.git vendor/solver
          git -C vendor/solver checkout --quiet "$SOLVER_COMMIT"

      - name: Install
        run: pip install -r requirements.txt

      - name: Self-test
        run: python tests/test_metrics.py

      - name: Run the pipeline
        run: python -m fplmodel.pipeline | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit outputs
        if: always() # keep whatever the run did produce, even if a step failed
        run: |
          git add data
          if git diff --cached --quiet; then echo "No output changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "data: pipeline run $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --quiet
          git push --quiet
